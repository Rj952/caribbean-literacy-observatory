name: Validate and deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check data integrity rules
        run: node scripts/validate.mjs
      - name: Check country coverage
        run: node scripts/coverage.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset versions so browsers never mix old and new code
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M)/g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - name: Give GitHub a moment to register the upload
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
